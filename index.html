<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindSage 🧞‍♂️</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; margin: 0; overflow: hidden; }
        
        /* Background Layer */
        #vanta-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Glassmorphism Effect for Card */
        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative; /* Logout button ko set karne ke liye add kiya */
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center">

    <div id="vanta-bg"></div>

    <div class="glass-card text-white w-[380px] p-8 rounded-3xl shadow-2xl text-center relative">
        
        <button id="logoutBtn" class="absolute top-5 right-6 text-xs font-bold text-rose-400 hover:text-rose-300 hover:underline transition-all hidden">
            Logout
        </button>

        <h1 class="text-3xl font-bold mb-1 tracking-tight">MindSage 🧞‍♂️</h1>
        
        <p id="welcomeMessage" class="text-xs font-semibold text-cyan-400 mb-2">Loading user...</p>
        
        <p id="sub-header" class="text-sm text-slate-400 mb-6">I can read your mind...</p>

        <div id="avatar" class="text-6xl mb-6 transition-all duration-500">🧠</div>

        <div class="w-full bg-slate-800 h-1.5 rounded-full mb-6 overflow-hidden">
            <div id="progressBar" class="h-full bg-cyan-400 transition-all duration-500 w-0"></div>
        </div>

        <p id="question" class="text-lg font-medium min-h-[80px] flex items-center justify-center mb-6">
            Think of a famous character and click Start!
        </p>

        <div id="controls">
            <button id="startBtn" class="w-full py-3 rounded-full font-bold bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-900 hover:scale-105 transition-transform shadow-lg shadow-cyan-500/20">
                START GAME
            </button>
        </div>

        <div id="options" class="hidden flex gap-3 justify-center">
            <button onclick="handleAnswer(true)" class="flex-1 py-3 rounded-xl font-bold bg-emerald-500/20 border border-emerald-500/50 text-emerald-400 hover:bg-emerald-500 hover:text-white transition-all">
                YES
            </button>
            <button onclick="handleAnswer(false)" class="flex-1 py-3 rounded-xl font-bold bg-rose-500/20 border border-rose-500/50 text-rose-400 hover:bg-rose-500 hover:text-white transition-all">
                NO
            </button>
        </div>
    </div>
   
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>
    <script src="script.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAb6ozoLOp7wtYSFqQ4vPWRJW4oKb4C2w0",
            authDomain: "mindsage-edbeb.firebaseapp.com",
            projectId: "mindsage-edbeb",
            storageBucket: "mindsage-edbeb.firebasestorage.app",
            messagingSenderId: "118728478646",
            appId: "1:118728478646:web:49fb3f80c1bc6194ccfb17",
            measurementId: "G-9SEQ9H38T8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Check user login status
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User logged in hai toh uska naam dikhao aur logout button show karo
                document.getElementById('welcomeMessage').innerText = `Welcome, ${user.displayName || 'Player'}!`;
                document.getElementById('logoutBtn').classList.remove('hidden');
            } else {
                // Agar login nahi hai, toh waapis login page pe phenk do
                window.location.href = 'login.html';
            }
        });

        // Logout logic
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = 'login.html';
            }).catch((error) => {
                alert("Error logging out!");
            });
        });
    </script>
</body>
</html>
