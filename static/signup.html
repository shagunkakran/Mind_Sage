<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | MindSage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #0f172a; font-family: 'Poppins', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); position: relative; z-index: 10; }
    </style>
</head>
<body id="vanta-canvas" class="flex items-center justify-center min-h-screen">
    
    <div class="glass p-8 rounded-2xl w-full max-w-md shadow-2xl text-white">
        <h1 class="text-3xl font-bold text-center mb-2">Create Account 🧞‍♂️</h1>
        <p class="text-slate-500 text-center mb-8 text-sm">Join MindSage today</p>
        
        <form id="signupForm" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-1">Full Name</label>
                <input type="text" id="name" required class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-cyan-400" placeholder="e.g. Shagun">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-cyan-400" placeholder="enter your email">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">Password</label>
                <input type="password" id="password" required class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 focus:border-cyan-400 outline-none" placeholder="min 6 characters">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-cyan-400 to-blue-500 py-3 rounded-lg font-bold hover:scale-105 transition-transform">
                SIGN UP
            </button>
            
            <p class="text-center text-sm text-slate-400 mt-4">
                Already have an account? <a href="login.html" class="text-cyan-400 hover:underline">Log in</a>
            </p>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script>
        VANTA.NET({ el: "#vanta-canvas", mouseControls: true, touchControls: true, gyroControls: false, minHeight: 200.00, minWidth: 200.00, scale: 1.00, scaleMobile: 1.00, color: 0x3fc6ff, backgroundColor: 0x0f172a, points: 12.00, maxDistance: 20.00, spacing: 16.00 });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAb6ozoLOp7wtYSFqQ4vPWRJW4oKb4C2w0",
            authDomain: "mindsage-edbeb.firebaseapp.com",
            projectId: "mindsage-edbeb",
            storageBucket: "mindsage-edbeb.firebasestorage.app",
            messagingSenderId: "118728478646",
            appId: "1:118728478646:web:49fb3f80c1bc6194ccfb17",
            measurementId: "G-9SEQ9H38T8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault(); 
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Naya account banao
            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Account banne ke baad usme User ka naam save karo
                    updateProfile(userCredential.user, {
                        displayName: name
                    }).then(() => {
                        alert('Account Created Successfully! Welcome to MindSage.');
                        window.location.href = 'index.html'; // Direct dashboard pe bhej do
                    });
                })
                .catch((error) => {
                    console.error("Signup Error:", error);
                    alert("Error: " + error.message); 
                });
        });
    </script>
</body>
</html>
